<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BroTV - Live Hub</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --gold: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: var(--panel-bg); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .logo { font-size: 24px; font-weight: bold; color: var(--accent); display: flex; align-items: center; gap: 10px; }
        .user-panel { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        
        button, .btn { background-color: var(--accent); color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; text-decoration: none; }
        button:hover { background-color: var(--accent-hover); }
        .btn-danger { background-color: var(--danger); }
        .btn-success { background-color: var(--success); }
        .btn-gold { background-color: var(--gold); color: black; }
        
        main { display: grid; grid-template-columns: 1fr 380px; gap: 20px; padding: 20px; flex: 1; max-width: 1500px; margin: 0 auto; width: 100%; }
        @media (max-width: 950px) { main { grid-template-columns: 1fr; } }
        
        .stream-section { display: flex; flex-direction: column; gap: 15px; }
        .player-container { background-color: var(--panel-bg); border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; position: relative; border: 1px solid #334155; }
        
        .player-container video, .player-container iframe { width: 100%; height: 100%; object-fit: cover; border: none; }
        
        .offline-message { text-align: center; color: var(--text-muted); padding: 20px; display: flex; flex-direction: column; gap: 8px; }
        .offline-message h3 { color: var(--text); font-size: 20px; }

        .announcements-bar { background: #334155; padding: 10px 15px; border-radius: 8px; font-size: 14px; }
        
        .sidebar { display: flex; flex-direction: column; gap: 15px; }
        .chat-section { background-color: var(--panel-bg); border-radius: 12px; display: flex; flex-direction: column; height: 450px; border: 1px solid #334155; }
        .chat-header { padding: 12px 15px; border-bottom: 1px solid #334155; font-weight: bold; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
        .chat-input-area { padding: 12px; border-top: 1px solid #334155; display: flex; gap: 8px; }
        .chat-input-area input { flex: 1; background: #0f172a; border: 1px solid #334155; padding: 8px 12px; border-radius: 6px; color: white; }

        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); display:none; align-items:center; justify-content:center; z-index:1000; }
        .modal-content { background: var(--panel-bg); padding: 25px; border-radius: 12px; width: 340px; display: flex; flex-direction: column; gap: 12px; }
        .modal-content input { padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; }
        
        .badge { background: var(--gold); color: black; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .badge-admin { background: #ef4444; color: white; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span>BroTV 🔴 Live</span>
            <span id="vipBadge" class="badge" style="display:none;">PREMIUM ⭐</span>
        </div>
        <div class="user-panel">
            <span id="userStatus">Vizitator</span>
            <button id="loginBtn" onclick="openModal('loginModal')">🔑 Log In</button>
            <button id="redeemBtn" onclick="openModal('codeModal')">🎁 Cod VIP</button>
            <a id="adminLink" href="admin.html" style="display:none;" class="btn btn-gold">⚙️ Admin</a>
            <button id="logoutBtn" style="display:none;" onclick="logout()" class="btn-danger">Logout</button>
        </div>
    </header>

    <main>
        <div class="stream-section">
            <div class="announcements-bar" id="announcementBox">
                📢 Bine ai venit pe BroTV! Așteptăm ca adminul să pornească un video.
            </div>

            <div class="player-container" id="playerContainer">
                <div class="offline-message" id="offlineState">
                    <h3>🔴 BroTV este Offline momentan</h3>
                    <p>Administratorul nu a pornit niciun videoclip încă.</p>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="chat-section">
                <div class="chat-header">Chat Live Clasa</div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Scrie pe chat..." onkeypress="checkSend(event)">
                    <button onclick="sendMessage()">Trimite</button>
                </div>
            </div>
        </div>
    </main>

    <div class="modal" id="loginModal">
        <div class="modal-content">
            <h3>Autentificare</h3>
            <input type="email" id="emailInput" placeholder="nume@gmail.com">
            <button onclick="login()">Intră</button>
            <button onclick="closeModal('loginModal')" class="btn-danger">Anulează</button>
        </div>
    </div>

    <div class="modal" id="codeModal">
        <div class="modal-content">
            <h3>Activează Cod VIP</h3>
            <input type="text" id="codeInput" placeholder="Codul tău...">
            <button class="btn-gold" onclick="redeemCode()">Activează</button>
            <button onclick="closeModal('codeModal')" class="btn-danger">Anulează</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://brotv-live-default-rtdb.europe-west1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = localStorage.getItem('bro_user') || null;
        let isPremium = localStorage.getItem('bro_premium') === 'true';
        const ADMINS = ["stefan.y8894yt@gmail.com", "dvdgeo90@gmail.com"];

        if(currentUser) applyUserSession(currentUser);

        db.ref('bro_state').on('value', (snapshot) => {
            const data = snapshot.val() || {};
            let streamUrl = data.current_stream || 'STOP';
            let announcement = data.announcement || '📢 Bine ai venit pe BroTV!';
            
            document.getElementById('announcementBox').innerText = announcement;
            const container = document.getElementById('playerContainer');

            if(streamUrl === 'STOP') {
                container.innerHTML = `
                    <div class="offline-message" id="offlineState">
                        <h3>🔴 BroTV este Offline momentan</h3>
                        <p>Administratorul nu a pornit niciun videoclip încă.</p>
                    </div>
                `;
            } else {
                if(streamUrl.includes('youtube.com') || streamUrl.includes('youtu.be')) {
                    let id = streamUrl.split('v=')[1]?.split('&')[0] || streamUrl.split('/').pop();
                    container.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
                } else {
                    container.innerHTML = `<video controls autoplay src="${streamUrl}"></video>`;
                }
            }
        });

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function login() {
            const email = document.getElementById('emailInput').value.trim();
            if(!email.includes('@')) return alert("Introdu un email valid!");
            currentUser = email;
            localStorage.setItem('bro_user', email);
            applyUserSession(email);
            closeModal('loginModal');
        }

        function applyUserSession(email) {
            document.getElementById('userStatus').innerHTML = email + (ADMINS.includes(email) ? ' <span class="badge badge-admin">ADMIN</span>' : '');
            document.getElementById('loginBtn').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'inline-block';

            if(isPremium || ADMINS.includes(email)) {
                document.getElementById('vipBadge').style.display = 'inline-block';
            }
            if(ADMINS.includes(email)) {
                document.getElementById('adminLink').style.display = 'inline-block';
            }
        }

        function logout() {
            localStorage.removeItem('bro_user');
            localStorage.removeItem('bro_premium');
            location.reload();
        }

        function redeemCode() {
            const code = document.getElementById('codeInput').value.trim().toUpperCase();
            db.ref('bro_codes/' + code).once('value', (snapshot) => {
                if(snapshot.exists() && snapshot.val() === true) {
                    isPremium = true;
                    localStorage.setItem('bro_premium', 'true');
                    db.ref('bro_codes/' + code).remove();
                    document.getElementById('vipBadge').style.display = 'inline-block';
                    alert("Cod activat cu succes! 🎉");
                    closeModal('codeModal');
                } else {
                    alert("Cod invalid sau deja folosit!");
                }
            });
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            if(!input.value.trim()) return;
            let name = currentUser ? currentUser.split('@')[0] : 'Guest';
            if(isPremium || ADMINS.includes(currentUser)) name += ' ⭐VIP';
            db.ref('bro_chat').push({ name: name, message: input.value });
            input.value = '';
        }
        function checkSend(e) { if(e.key === 'Enter') sendMessage(); }

        db.ref('bro_chat').limitToLast(50).on('child_added', (snapshot) => {
            const val = snapshot.val();
            const chat = document.getElementById('chatMessages');
            chat.innerHTML += `<div><b>${val.name}:</b> ${val.message}</div>`;
            chat.scrollTop = chat.scrollHeight;
        });
    </script>
</body>
</html>
